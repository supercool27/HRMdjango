{% extends 'base_nonavbar.html' %}
{% load form_filters %}
{% block title %}Delete Role{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card border-danger">
        <div class="card-header bg-danger text-white">
          <h5 class="mb-0">🗑️ Confirm Delete</h5>
        </div>
        <div class="card-body">
          <p class="fs-5">Are you sure you want to delete the role <strong class="text-danger">"{{ role.name }}"</strong>?</p>

          <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between mt-4">
              <button type="submit" class="btn btn-danger px-4">✅ Yes, Delete</button>
              <a href="{% url 'role_list' %}" class="btn btn-secondary px-4">❌ Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
