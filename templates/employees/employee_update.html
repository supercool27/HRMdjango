{% extends "base_nonavbar.html" %}
{% block title %}Update Employee{% endblock %}
{% block content %}
<div class="container-fluid py-4">
  <div class="row">
    <div class="col-12 mx-auto">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">✏️ Update Employee - {{ employee.user.get_full_name }}</h5>
          <a href="{% url 'employee_delete' employee.pk %}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this employee?')">🗑️ Delete</a>
        </div>
        <div class="card-body pt-3">
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {% include "employee_form_fields.html" %} {# Reuse same field layout from add form #}

            <div class="text-center mt-4">
              <button class="btn btn-primary w-100" type="submit">💾 Update Employee</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
